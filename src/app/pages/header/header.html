<header class="header">
    <div class="logo-section">
        <button class="menu-icon" (click)="toggleMenu()">
            <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
        </button>
        <a routerLink="/" class="logo" (click)="closeMenu()">
            <img src="/profile-photo.png" alt="Akash">
            <span class="gradient-text">My Portfolio</span>
        </a>
    </div>

    <nav class="navbar" [class.active]="isMenuOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">
            Home
        </a>
        <a routerLink="/education" routerLinkActive="active" (click)="closeMenu()">
            Education
        </a>
        <a routerLink="/skills-experience" routerLinkActive="active" (click)="closeMenu()">
            Skill & Experience
        </a>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
            Projects
        </a>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">
            Contact
        </a>
    </nav>
</header>
